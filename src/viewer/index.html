<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FloeBrowser</title>
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="browser-window">
      <div class="tab-strip">
        <div id="tabs" role="tablist" aria-label="Source browser tabs"></div>
        <button
          id="new-tab"
          class="icon-button"
          aria-label="New tab"
          title="New tab"
        >
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 4v12M4 10h12" />
          </svg>
        </button>
      </div>
      <span
        id="tab-announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
      ></span>
      <nav class="toolbar" aria-label="Browser navigation">
        <div class="navigation-buttons">
          <button class="icon-button" id="back" title="Back" aria-label="Back">
            <svg viewBox="0 0 20 20"><path d="m11 5-5 5 5 5M6 10h10" /></svg>
          </button>
          <button
            class="icon-button"
            id="forward"
            title="Forward"
            aria-label="Forward"
          >
            <svg viewBox="0 0 20 20"><path d="m9 5 5 5-5 5M14 10H4" /></svg>
          </button>
          <button
            class="icon-button"
            id="reload"
            title="Reload"
            aria-label="Reload source page"
          >
            <svg viewBox="0 0 20 20">
              <path d="M16 9a6 6 0 1 0-1 4M16 4v5h-5" />
            </svg>
          </button>
        </div>
        <form class="address-bar" id="address-form">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7" />
            <path d="M3 10h14M10 3c4 4 4 10 0 14-4-4-4-10 0-14Z" />
          </svg>
          <input
            id="address"
            aria-label="Website address"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="address-suggestions"
            aria-expanded="false"
            placeholder="Search or enter an address"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button
            type="submit"
            id="address-go"
            class="icon-button"
            aria-label="Open website"
            title="Go"
          >
            <svg viewBox="0 0 20 20"><path d="M4 10h12m-5-5 5 5-5 5" /></svg>
          </button>
          <div
            id="address-suggestions"
            role="listbox"
            aria-label="Address suggestions"
            hidden
          ></div>
        </form>
        <div id="media-controls"></div>
        <span
          class="status connecting"
          id="status"
          role="status"
          title="Connecting"
          >Connecting</span
        >
      </nav>
      <div class="stage">
        <div id="viewport"></div>
        <div class="welcome" id="welcome" hidden>
          <div class="new-tab-content">
            <svg
              class="new-tab-mark"
              viewBox="0 0 28 28"
              fill="none"
              aria-hidden="true"
            >
              <path d="M5 5h18v6H11v5h10v6H5V5Z" fill="currentColor" />
              <path d="m17 5 6 6V5h-6Z" fill="#a8b9d6" />
            </svg>
            <h1>FloeBrowser</h1>
            <button id="start-browsing">
              <svg viewBox="0 0 20 20">
                <circle cx="8.5" cy="8.5" r="5.5" />
                <path d="m13 13 4 4" /></svg
              ><span>Search or enter an address</span
              ><kbd id="address-shortcut">Ctrl L</kbd>
            </button>
          </div>
        </div>
        <div class="connection-overlay" id="connection-overlay">
          <div class="connection-card">
            <span class="connection-symbol" id="connection-symbol"></span>
            <h2 id="connection-title">Connecting to your browser</h2>
            <p id="connection-description">Your page will appear shortly.</p>
            <button class="primary-button" id="reconnect" hidden>
              Reconnect
            </button>
          </div>
        </div>
      </div>
    </main>
    <div class="toast" id="toast" role="status" hidden>
      <span id="toast-message"></span
      ><button id="dismiss-toast" aria-label="Dismiss message">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="m6 6 8 8M14 6l-8 8" />
        </svg>
      </button>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
