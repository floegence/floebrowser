name: Browser qualification
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Browser qualification scope
        type: choice
        default: all
        options:
          - all
          - linux-regressions
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /opt/floebrowser-qualification
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: media/go.mod
          cache-dependency-path: |
            media/go.sum
            test/flowersec/go.sum
      - run: go test -race ./...
        working-directory: media
      - name: Create the qualification browser directory
        run: sudo install -d -m 755 -o "$(id -u)" "$PLAYWRIGHT_BROWSERS_PATH"
      - run: npx playwright install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
      - name: Start the qualification audio device
        run: |
          sudo apt-get install --yes pulseaudio
          mkdir -p .test-artifacts
          pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target=file:"$PWD/.test-artifacts/pulseaudio.log"
          pactl load-module module-null-sink sink_name=floebrowser
          pactl set-default-sink floebrowser
      - name: Prepare and verify sandboxed Chromium
        run: |
          sudo chown -R root:root "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chmod -R go-w "$PLAYWRIGHT_BROWSERS_PATH"
          browser_executables=(
            "$PLAYWRIGHT_BROWSERS_PATH"/chromium-*/chrome-linux64/chrome
            "$PLAYWRIGHT_BROWSERS_PATH"/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell
          )
          for browser_executable in "${browser_executables[@]}"; do
            [[ -f "$browser_executable" && -x "$browser_executable" && ! -L "$browser_executable" ]]
          done
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] && [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == 1 ]]; then
            {
              printf 'abi <abi/4.0>,\ninclude <tunables/global>\n'
              for index in "${!browser_executables[@]}"; do
                printf 'profile floebrowser-qualification-%s "%s" flags=(unconfined) {\n  userns,\n}\n' "$index" "${browser_executables[$index]}"
              done
            } | sudo tee /etc/apparmor.d/floebrowser-qualification >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/floebrowser-qualification
          fi
          node --input-type=module -e 'import {chromium} from "playwright"; for (const channel of [undefined,"chromium"]) { const browser=await chromium.launch({channel,chromiumSandbox:true}); await browser.close(); }'
      - run: npm run build
      - name: Run browser qualification
        env:
          QUALIFICATION_SUITE: ${{ inputs.suite }}
        run: |
          set -o pipefail
          # Crash tests must observe renderer exit, not wait for the runner's
          # external core-dump collector. This VM belongs only to this job.
          cat /proc/sys/kernel/core_pattern
          sudo sysctl -w kernel.core_pattern=core
          ulimit -c 0
          case "$QUALIFICATION_SUITE" in
            all) tests=(test/*.e2e.ts) ;;
            linux-regressions) tests=(test/canvas-webgpu.e2e.ts test/input-style.e2e.ts test/media-collector.e2e.ts test/media-reattach.e2e.ts test/media-sync.e2e.ts test/media-ui.e2e.ts test/object-fallback.e2e.ts test/tab-isolation.e2e.ts test/viewer-engines.e2e.ts) ;;
            *) exit 1 ;;
          esac
          mkdir -p .test-artifacts
          node --import tsx --test --test-reporter=tap --test-concurrency=1 "${tests[@]}" | tee .test-artifacts/qualification.tap
          node scripts/check-browser-report.mjs .test-artifacts/qualification.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: .test-artifacts/
          include-hidden-files: true
          if-no-files-found: error
