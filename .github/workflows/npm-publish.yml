name: Publish npm package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing qualified release tag to publish
        required: true
        type: string
      verify_only:
        description: Only verify an upload already acknowledged by npm
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'floegence/floebrowser' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: read
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the qualified release
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="$INPUT_RELEASE_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: qualified-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Require exact-commit security qualification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          commit=$(git -C qualified-source rev-parse HEAD)
          node scripts/check-security.mjs "$commit" --release
      - name: Download the qualified release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" --dir release --pattern 'floegence-floebrowser-*.tgz' --pattern SHA256SUMS
          cd release
          sha256sum --check --strict SHA256SUMS
      - name: Publish with npm Trusted Publisher and verify registry readback
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_ONLY: ${{ inputs.verify_only || 'false' }}
        run: node scripts/publish-npm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-readback-${{ steps.release.outputs.tag }}
          path: release/npm-readback.json
          if-no-files-found: error
